---
# Refreshes the cache only when it's older than common_apt_cache_valid_time.
# Upgrades live in upgrade.yml, so this role's result doesn't depend on the
# state of the Debian mirror.
- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages + ['qemu-guest-agent'] }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ common_apt_cache_valid_time }}"

- name: Start the QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started
    enabled: true
