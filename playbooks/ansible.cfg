[defaults]
inventory = ./inventory/hosts.yml
# Silence the interpreter discovery warning
interpreter_python = auto_silent

[ssh_connection]
# Ansible's default ssh_args, plus accept-new: a new host's key is accepted on
# first contact, and a known host whose key changed is refused (ADR 0006).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
