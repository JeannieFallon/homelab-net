---
# group_vars/all.yml
user: homelab-admin
pkgs:
  - sudo
  - tmux
  - vim
  - rsync
  - curl
  - ufw
  - btop
  - tree
mgmt_net: 192.168.0.0/16
# Note: This path is on the Ansible control node.
# Ensure the public key file exists at this location.
ssh_key_pub: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
