# ~/.tmux.conf
# References:
#   http://www.deanbodenham.com/learn/tmux-conf-file.html
#   https://gist.github.com/spicycode/1229612

# ============================================================
# Prefix
# ============================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix    # press prefix twice to send literal C-a (start of line)

# ============================================================
# General options
# ============================================================
set  -g base-index 1
set  -g pane-base-index 1
set  -g renumber-windows on
set  -g default-terminal "screen-256color"
set  -g status-keys vi
set  -g history-limit 10000
set  -g mouse on
set  -sg escape-time 0      # no delay after Escape

setw -g mode-keys vi
setw -g monitor-activity on
setw -g automatic-rename on
set-option -g set-titles on

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# ============================================================
# Mouse toggle
# ============================================================
bind m set -g mouse on  \; display "Mouse: ON"
bind M set -g mouse off \; display "Mouse: OFF"

# ============================================================
# Splits (prefix + ...)
#   v / |  -> horizontal split
#   s / -  -> vertical split
# ============================================================
bind-key v split-window -h
bind-key | split-window -h
bind-key s split-window -v
bind-key - split-window -v

# ============================================================
# Pane navigation (prefix + hjkl, vim-style)
# ============================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============================================================
# Pane navigation (no prefix)
#   Alt-hjkl and Alt-arrows
# ============================================================
bind -n M-h     select-pane -L
bind -n M-j     select-pane -D
bind -n M-k     select-pane -U
bind -n M-l     select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Cycle panes with F2/F3 (no prefix)
bind-key -nr F2 select-pane -t :.-
bind-key -nr F3 select-pane -t :.+

# ============================================================
# Pane resize (prefix + ...)
#   Shift-HJKL -> resize by 5
#   Alt-hjkl   -> resize by 1
# ============================================================
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

bind-key M-h resize-pane -L
bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-l resize-pane -R

# ============================================================
# Window navigation (no prefix)
# ============================================================
bind -n S-Left  previous-window
bind -n S-Right next-window

# ============================================================
# Copy mode (vi-style) + system clipboard via xclip
#   Alt-/ enters copy mode
#   v starts selection, y / Enter / mouse-drag copy to clipboard
# ============================================================
bind-key -n M-/ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Escape send-keys -X cancel

# ============================================================
# Theme: Dracula
#   bg            #282a36
#   current line  #44475a
#   fg            #f8f8f2
#   comment       #6272a4
#   cyan          #8be9fd
#   green         #50fa7b
#   orange        #ffb86c
#   pink          #ff79c6
#   purple        #bd93f9
#   red           #ff5555
#   yellow        #f1fa8c
# ============================================================

# Pane borders
set -g pane-border-style        fg='#6272a4'
set -g pane-active-border-style fg='#ff79c6'

# Message text
set -g message-style bg='#44475a',fg='#8be9fd'

# Status bar
set -g status-style    bg='#44475a',fg='#bd93f9'
set -g status-interval 1

# Status left: prefix indicator + zoom indicator
set  -g status-left  '#[bg=#f8f8f2]#[fg=#282a36]#{?client_prefix,#[bg=#ff79c6],} ☺ '
set -ga status-left  '#[bg=#44475a]#[fg=#ff79c6] #{?window_zoomed_flag, ↕  ,   }'

# Window status
set-window-option -g window-status-style         fg='#bd93f9',bg=default
set-window-option -g window-status-current-style fg='#ff79c6',bg='#282a36'
set -g window-status-current-format "#[fg=#44475a]#[bg=#bd93f9]#[fg=#f8f8f2]#[bg=#bd93f9] #I #W #[fg=#bd93f9]#[bg=#44475a]"
set -g window-status-format         "#[fg=#f8f8f2]#[bg=#44475a]#I #W #[fg=#44475a] "

# Status right: cpu/mem | uptime | date/time
set  -g status-right '#[fg=#8be9fd,bg=#44475a]#[fg=#44475a,bg=#8be9fd] #(tmux-mem-cpu-load -g 5 --interval 2) '
set -ga status-right '#[fg=#ff79c6,bg=#8be9fd]#[fg=#44475a,bg=#ff79c6] #(uptime | cut -f 4-5 -d " " | cut -f 1 -d ",") '
set -ga status-right '#[fg=#bd93f9,bg=#ff79c6]#[fg=#f8f8f2,bg=#bd93f9] %a %H:%M:%S #[fg=#6272a4]%Y-%m-%d '